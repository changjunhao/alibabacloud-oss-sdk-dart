name: alibabacloud_oss_sdk_dart
description: >-
  Alibaba Cloud Object Storage Service (OSS) SDK for Dart,
  providing comprehensive APIs for bucket and object operations.
version: 1.0.0
repository: https://github.com/aliyun/alibabacloud-oss-dart-sdk
issue_tracker: https://github.com/aliyun/alibabacloud-oss-dart-sdk/issues
topics:
  - oss
  - alibaba-cloud
  - object-storage
  - cloud

environment:
  sdk: ^3.8.1

# Add regular dependencies here.
dependencies:
  dio: ^5.9.2
  crypto: ^3.0.7
  xml: ^7.0.1
  convert: ^3.1.2
  mime: ^2.0.0
  intl: ^0.20.2
  path: ^1.9.1
  meta: ^1.18.3

dev_dependencies:
  build_runner: ^2.15.0
  lints: ^6.1.0
  mockito: ^5.7.0
  test: ^1.31.1
  yaml: ^3.1.3
